<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Administrador - Mascotas Pino</title>
  <!-- Framework CSS: Bootstrap 5 para controles de formulario responsivos. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <section id="admin-section">
    <button id="adminLoginBtn" class="admin-togglen">Administrador</button>

    <div id="adminPanel" class="admin-panel">
      <h2>Panel de Administración</h2>

      <h3 style="margin-top: 20px;">Agregar Nuevo Producto</h3>
      <form id="addProductForm">
        <div class="form-group">
          <label>Imagen del producto (archivo o URL):</label><br>
          <input class="form-control" type="file" id="newImageFile" accept="image/*" />
          <input class="form-control" type="text" id="newImage" placeholder="https://ejemplo.com/imagen.jpg" />
          <div id="imagePreview" style="margin-top:10px;">
            <img id="previewImg" src="" alt="" style="max-width:200px; display:none;">
          </div>
          <progress id="uploadProgress" value="0" max="100" style="width:100%; display:none;"></progress>
        </div>

        <div class="form-group">
          <label>Nombre:</label>
          <input class="form-control" type="text" id="newName" placeholder="Nombre del producto" required />
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <select class="form-select" id="newCategory" required>
  <option value="ropa">Ropa</option>
  <option value="collar">Collar italiano</option>
  <option value="accesorios">Accesorios</option>
  <option value="cadena">Cadena petrolizada</option>
  <option value="camas">Camas</option>
  <option value="pecheras">Pecheras</option>
</select>

        </div>

        <div class="form-group">
          <label>Descripción:</label>
          <textarea class="form-control" id="newDescription" placeholder="Descripción del producto" required></textarea>
        </div>

        <div class="form-group">
          <label>Precio:</label>
          <input class="form-control" type="number" id="newPrice" placeholder="50000" required />
        </div>

        <div class="form-group">
          <label>Stock (unidades disponibles):</label>
          <input class="form-control" type="number" id="newStock" placeholder="Ej: 20" required min="0" />
        </div>

        <button type="submit" class="btn">Agregar Producto</button>
      </form>

      <!-- EDIT FORM: aparece solo cuando se edita -->
      <h3 style="margin-top:30px;">Editar Producto</h3>
      <form id="editProductForm" style="display:none; background:#f9f9f9; padding:15px; border-radius:10px;">
        <input class="form-control" type="hidden" id="editId">

        <div class="form-group">
          <label>Imagen (archivo o URL):</label><br>
          <input class="form-control" type="file" id="editImageFile" accept="image/*" />
          <input class="form-control" type="text" id="editImage" placeholder="https://ejemplo.com/imagen.jpg" required />
          <div id="editImagePreview" style="margin-top:10px;">
            <img id="editPreviewImg" src="" alt="" style="max-width:200px; display:none;">
          </div>
          <progress id="editUploadProgress" value="0" max="100" style="width:100%; display:none;"></progress>
        </div>

        <div class="form-group">
          <label>Nombre:</label>
          <input class="form-control" type="text" id="editName" required />
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <select class="form-select" id="editCategory" required>
  <option value="ropa">Ropa</option>
  <option value="collar">Collar italiano</option>
  <option value="accesorios">Accesorios</option>
  <option value="cadena">Cadena petrolizada</option>
  <option value="camas">Camas</option>
  <option value="pecheras">Pecheras</option>
</select>

        </div>

        <div class="form-group">
          <label>Descripción:</label>
          <textarea class="form-control" id="editDescription" required></textarea>
        </div>

        <div class="form-group">
          <label>Precio:</label>
          <input class="form-control" type="number" id="editPrice" required />
        </div>

        <div class="form-group">
          <label>Stock:</label>
          <input class="form-control" type="number" id="editStock" required min="0" />
        </div>

        <button type="submit" class="btn">Guardar Cambios</button>
        <button type="button" class="btn" onclick="cancelEdit()" style="background:#999;">Cancelar</button>
      </form>

      <!-- MODAL DE EDICIÓN -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Editar Producto</h3>

    <form id="modalEditForm">
      <input class="form-control" type="hidden" id="modalEditId">

      <label>Imagen (URL):</label>
      <input class="form-control" type="text" id="modalEditImage" required>

      <label>Nombre:</label>
      <input class="form-control" type="text" id="modalEditName" required>

      <label>Categoría:</label>
      <select class="form-select" id="modalEditCategory" required>
        <option value="ropa">Ropa</option>
  <option value="collar">Collar italiano</option>
  <option value="accesorios">Accesorios</option>
  <option value="cadena">Cadena petrolizada</option>
  <option value="camas">Camas</option>
  <option value="pecheras">Pecheras</option>
</select>

      <label>Descripción:</label>
      <textarea class="form-control" id="modalEditDescription" required></textarea>

      <label>Precio:</label>
      <input class="form-control" type="number" id="modalEditPrice" required>

      <label>Stock:</label>
      <input class="form-control" type="number" id="modalEditStock" required min="0">

      <div class="modal-buttons">
        <button type="submit" class="btn">Guardar Cambios</button>
        <button type="button" class="btn cancel-btn" onclick="closeEditModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>


      <h3 style="margin-top:30px;">Catálogo Actual</h3>
      <div id="adminProductList" class="products-grid"></div>
    </div>
  </section>

  <!-- scripts: script.js primero (productos), luego admin.js -->
  <script src="js/script.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
